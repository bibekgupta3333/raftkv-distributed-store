name: raftkv

# 5-node RaftKV cluster plus Prometheus (WBS 2.5.2), Grafana (WBS 7.3.1) and the
# observer UI (D-48, WBS 7.2.3). The e2e harness drives it from the host: peer
# gRPC on 127.0.0.1:17001-17005, /metrics on 19001-19005; it starts only the
# five nodes. Everything is published on localhost only:
#   Prometheus http://127.0.0.1:19090
#   Grafana    http://127.0.0.1:13000 (anonymous viewer, dashboard "RaftKV overview")
#   Observer   http://127.0.0.1:18080
# NET_ADMIN lets the fault driver run iptables / tc inside a node container.
x-node: &node
  image: ${IMAGE:-raftkvd:e2e}
  build:
    context: ../..
    target: e2e
    args:
      GOFLAGS_TAGS: debugpropose
  cap_add: [NET_ADMIN]
  restart: "no"
  stop_grace_period: 5s

x-peers: &peers --peers=1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000
# Membership (M6): slot k (container raftkv-nodek, hostname nodek) runs member ID
# RAFTKV_NODEk_ID (default k). The e2e harness rejoins a slot as a new learner
# with RAFTKV_NODEk_ID=<ID AddLearner assigned> RAFTKV_NODEk_JOIN=true on a fresh
# volume (D-32, D-38); --peers then only supplies addresses.
# Snapshot policy (D-14, D-30). The e2e snapshot tests lower it so snapshots
# and WAL trims happen within seconds; the defaults are the D-14 values.
x-snap-entries: &snapEntries --snapshot-entries=${RAFTKV_SNAPSHOT_ENTRIES:-100000}
x-snap-retain: &snapRetain --snapshot-retain-entries=${RAFTKV_SNAPSHOT_RETAIN:-10000}

services:
  node1:
    <<: *node
    hostname: node1
    container_name: raftkv-node1
    command: [--data-dir=/data, "--node-id=${RAFTKV_NODE1_ID:-1}", "--join=${RAFTKV_NODE1_JOIN:-false}", --cluster-id=1, --listen=:7000, --metrics-addr=:9100, *peers, *snapEntries, *snapRetain]
    ports: ["127.0.0.1:17001:7000", "127.0.0.1:19001:9100"]
    volumes: ["data1:/data"]
  node2:
    <<: *node
    hostname: node2
    container_name: raftkv-node2
    command: [--data-dir=/data, "--node-id=${RAFTKV_NODE2_ID:-2}", "--join=${RAFTKV_NODE2_JOIN:-false}", --cluster-id=1, --listen=:7000, --metrics-addr=:9100, *peers, *snapEntries, *snapRetain]
    ports: ["127.0.0.1:17002:7000", "127.0.0.1:19002:9100"]
    volumes: ["data2:/data"]
  node3:
    <<: *node
    hostname: node3
    container_name: raftkv-node3
    command: [--data-dir=/data, "--node-id=${RAFTKV_NODE3_ID:-3}", "--join=${RAFTKV_NODE3_JOIN:-false}", --cluster-id=1, --listen=:7000, --metrics-addr=:9100, *peers, *snapEntries, *snapRetain]
    ports: ["127.0.0.1:17003:7000", "127.0.0.1:19003:9100"]
    volumes: ["data3:/data"]
  node4:
    <<: *node
    hostname: node4
    container_name: raftkv-node4
    command: [--data-dir=/data, "--node-id=${RAFTKV_NODE4_ID:-4}", "--join=${RAFTKV_NODE4_JOIN:-false}", --cluster-id=1, --listen=:7000, --metrics-addr=:9100, *peers, *snapEntries, *snapRetain]
    ports: ["127.0.0.1:17004:7000", "127.0.0.1:19004:9100"]
    volumes: ["data4:/data"]
  node5:
    <<: *node
    hostname: node5
    container_name: raftkv-node5
    command: [--data-dir=/data, "--node-id=${RAFTKV_NODE5_ID:-5}", "--join=${RAFTKV_NODE5_JOIN:-false}", --cluster-id=1, --listen=:7000, --metrics-addr=:9100, *peers, *snapEntries, *snapRetain]
    ports: ["127.0.0.1:17005:7000", "127.0.0.1:19005:9100"]
    volumes: ["data5:/data"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["127.0.0.1:19090:9090"]
    depends_on: [node1, node2, node3, node4, node5]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/raftkv.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
    depends_on: [prometheus]

  # Read-only live view of the cluster (D-48). Same image as the nodes, other
  # binary. It listens on all interfaces inside the container; the port is
  # published on localhost only (no auth).
  observer:
    image: ${IMAGE:-raftkvd:e2e}
    entrypoint: [/usr/local/bin/raftkv-observer]
    command:
      - --listen=:8080
      - --interval=500ms
      - --endpoints=node1=node1:7000,node2=node2:7000,node3=node3:7000,node4=node4:7000,node5=node5:7000
    ports: ["127.0.0.1:18080:8080"]
    restart: "no"
    depends_on: [node1, node2, node3, node4, node5]

volumes:
  data1: {name: raftkv_data1}
  data2: {name: raftkv_data2}
  data3: {name: raftkv_data3}
  data4: {name: raftkv_data4}
  data5: {name: raftkv_data5}
