# RaftKV on Kubernetes (D-16, WBS 7.1). Namespace-agnostic: peers are addressed
# by short DNS names (raftkv-N.raftkv-peer) that resolve inside whatever
# namespace an overlay picks.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - pairs:
      app.kubernetes.io/name: raftkv
      app.kubernetes.io/part-of: raftkv
    includeSelectors: true

resources:
  - configmap.yaml
  - services.yaml
  - statefulset.yaml
