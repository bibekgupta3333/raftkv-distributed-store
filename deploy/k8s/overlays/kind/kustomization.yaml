# kind overlay (WBS 7.1.6): `make kind-up` builds raftkvd:kind, loads it into
# the kind cluster and applies this. kind's default local-path StorageClass
# backs the PVCs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: raftkv

resources:
  - namespace.yaml
  - ../../base

images:
  - name: raftkvd
    newTag: kind

patches:
  # The image only exists inside the kind nodes (kind load); never pull it.
  - target: {kind: StatefulSet, name: raftkv}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
