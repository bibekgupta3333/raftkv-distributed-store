name: nightly
# D-19, WBS 1.7.5: long deterministic-simulator run with fresh seeds each day.
# Also: fuzzing (WBS 7.5.1), long e2e and kind + Chaos Mesh (WBS 7.4.6).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: "seeds per profile"
        default: "100000"
      base_seed:
        description: "first seed (default: derived from the run ID)"
        default: ""
      jobs:
        description: "jobs to run: all, or a comma-separated subset of sim-long,sim-race,fuzz-long,e2e-long,chaos"
        default: "all"
      chaos_duration:
        description: "length of the chaos fault schedule"
        default: "15m"
# A scheduled run has no inputs: inputs.jobs is empty and every job runs.
jobs:
  sim-long:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'sim-long') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        faults: [full, lossy, partition, crash, snapshot, membership]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run seeds
        env:
          SEEDS: ${{ inputs.seeds || '100000' }}
          BASE: ${{ inputs.base_seed }}
          FAULTS: ${{ matrix.faults }}
        run: |
          # A different seed range every day; the base is logged so a failure can be replayed.
          SEED="${BASE:-$(( (GITHUB_RUN_ID % 1000000) * 1000000 ))}"
          echo "profile=$FAULTS first seed=$SEED seeds=$SEEDS"
          make sim SEEDS="$SEEDS" SEED="$SEED" FAULTS="$FAULTS"
      - name: upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-long-failure-${{ matrix.faults }}
          path: out/sim/
  # WBS 1.9.1 (M1 exit criterion 1 + 6): 10,000 seeds of the full fault profile
  # with the race detector on, so the node, network and checker code the
  # simulator drives is race-checked at the same scale as the exit criterion.
  sim-race:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'sim-race') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: run seeds with -race
        env:
          BASE: ${{ inputs.base_seed }}
        run: |
          SEED="${BASE:-$(( (GITHUB_RUN_ID % 1000000) * 1000000 ))}"
          echo "profile=full first seed=$SEED seeds=10000 race=on"
          make sim SEEDS=10000 SEED="$SEED" FAULTS=full SIMRACE=-race
      # M4 exit criterion 5 (WBS 4.3.6): identical session-table hashes across
      # replicas for 10,000 seeds crossing the expiry time (PR CI runs 1,000).
      - name: session table determinism, 10,000 seeds
        run: go test ./internal/storage/ -run TestSessionTableDeterministic -session-seeds=10000 -count=1 -v -timeout=30m
      - name: upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-race-failure
          path: out/sim/
  # WBS 7.5.1: every native Go fuzz target (WAL records and segment headers,
  # snapshot metadata, command envelope, page tokens, state-machine records,
  # YAML config) for a few minutes each. A crasher fails the job; its input
  # is uploaded so it can be committed under <pkg>/testdata/fuzz/.
  fuzz-long:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'fuzz-long') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz FUZZTIME=3m
      - name: upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/"
  # WBS 2.6.7: long docker-compose e2e (200 kill -9/restart rounds, 40-step seeded fault schedule).
  # WBS 4.6.2: also the Porcupine-checked Put/Get/Delete/CAS/Range workload under leader kill,
  # SIGSTOP and partitions (TestLinearizableKVUnderFaults, 6 fault cycles in the nightly profile),
  # preceded by the deliberately broken build the checker must catch (testing.md 3.4).
  e2e-long:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'e2e-long') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make mutation
      - run: make e2e E2E_PROFILE=nightly E2E_SEED=${{ inputs.base_seed || github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-long
          path: out/e2e/
          retention-days: 30
  # WBS 7.4.4, 7.4.6 (D-47, docs/testing.md 2.6): kind + Chaos Mesh. The 5-node
  # StatefulSet runs the mixed Porcupine workload from an in-cluster client pod
  # while a seeded schedule applies, holds and clears pod kills, a partition,
  # delay and loss; any linearizability violation fails the job. Histories,
  # the fault log, the seed and pod logs are uploaded on failure.
  chaos:
    if: ${{ !inputs.jobs || inputs.jobs == 'all' || contains(inputs.jobs, 'chaos') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_VERSION: v0.30.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install kind (pinned)
        run: |
          GOBIN="$PWD/bin" go install "sigs.k8s.io/kind@$KIND_VERSION"
          echo "KIND=$PWD/bin/kind" >> "$GITHUB_ENV"
          "$PWD/bin/kind" version; kubectl version --client; helm version
      - name: kind cluster + Chaos Mesh
        run: make chaos-up
      - name: chaos schedule + Porcupine check
        env:
          SEED: ${{ inputs.base_seed || github.run_id }}
          DURATION: ${{ inputs.chaos_duration || '15m' }}
        run: make chaos CHAOS_DURATION="$DURATION" CHAOS_SEED="$SEED"
      - name: upload chaos artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chaos
          path: out/chaos/
          retention-days: 30
      - name: delete the kind cluster
        if: always()
        run: make chaos-down
