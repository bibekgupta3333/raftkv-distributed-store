name: pr
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check lint build test race
      - name: proto drift check
        run: make proto && git diff --exit-code
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          if ls test/sim/*_test.go >/dev/null 2>&1; then make sim; else echo "no sim yet"; fi
  e2e-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make e2e E2E_PROFILE=pr E2E_SEED=${{ github.event.pull_request.number || github.run_number }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-short
          path: out/e2e/
          retention-days: 30
