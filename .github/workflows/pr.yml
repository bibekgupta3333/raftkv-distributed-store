name: pr
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check lint build test race
      # M0 exit criterion 4, WBS 0.2.4: the binary is stamped with its version and git SHA.
      - name: raftkvd --version
        run: ./bin/raftkvd --version | tee /dev/stderr | grep -F "($(git rev-parse --short HEAD))"
      # testing.md 3.4, WBS 4.6.1: the checker must catch a deliberately broken read path.
      - run: make mutation
      - name: proto drift check
        run: make proto && git diff --exit-code
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # D-18, WBS 1.7.4: 500 seeds with the full fault profile plus the regression seeds.
      - run: make sim SEEDS=500 FAULTS=full
      - run: make sim SEEDS=500 FAULTS=snapshot
      - run: make sim SEEDS=500 FAULTS=membership
      - name: upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-failure
          path: out/sim/
  e2e-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make e2e E2E_PROFILE=pr E2E_SEED=${{ github.event.pull_request.number || github.run_number }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-short
          path: out/e2e/
          retention-days: 30
