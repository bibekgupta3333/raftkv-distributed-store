name: pr
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make fmt-check lint build test race
      - name: proto drift check
        run: make proto && git diff --exit-code
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # D-18, WBS 1.7.4: 500 seeds with the full fault profile plus the regression seeds.
      - run: make sim SEEDS=500 FAULTS=full
      - name: upload failing-seed traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-failure
          path: out/sim/
